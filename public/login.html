<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | My AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #171717;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            width: 400px;
            max-width: 92%;
            padding: 35px;
            background: #262626;
            border: 1px solid #404040;
            border-radius: 20px;
        }

        .logo {
            text-align: center;
            font-size: 35px;
            font-weight: bold;
            background: linear-gradient(90deg, #818cf8, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #303030;
            border: 1px solid #555;
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #a78bfa;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #6d28d9;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">My AI</div>

        <h2>Welcome back</h2>

        <p>Sign in to your AI Assistant</p>

        <form id="login-form">

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <button type="submit">Continue</button>

        </form>

    </div>

    <script src="login.js"></script>

</body>
</html>
